<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto treno</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div>
        <form action="form">
            <h1>Calcola il prezzo biglietto</h1>
            <div class="main">
                <div class="detagli">
                    <div>
                        <input class="form-control" placeholder="Nome Completo" type="text" id="nome-completo" required />
                    </div>
                    <div>
                        <input class="form-control" placeholder="Quanti km deve percorere" type="text" id="km-percorere" required />
                    </div>
                    <div>
                        <input class="form-control" placeholder="Quanti anni ha?" type="text" id="eta" />
                    </div>
                </div>
                <div>
                    <a href="#"><button id="button" class="btn btn-primary ">Conferma</button></a>
                </div>
            </div>
            
        </form>
    </div>     

    <h1></h1>
    <div class="biglietto">
        <div>
            <h2>Nome paseggero:</h2>
            <b><span id="nome"></span></b>
        </div>
        <div>
            <h2>Offerta da aplicare:</h2>
            <b><span id="offerta"></span></b>
        </div>
        <div>
            <h2>Prezzo finale:</h2>
            <b><span id="prezzo"></span></b>
        </div>
    
    </div>     
    <script defer src="./script/script.js"></script>       
</body>

</html>
