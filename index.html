<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biglietto treno</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <div class="container mt-3">
        <div class="row">
            <div class="col-md-8">
                <form action="">
                    <div class="row g-3 row-cols-2">
                        <div class="col">
                            <input class="form-control" placeholder="Nome Completo" type="text" id="nome-completo"
                                required />
                        </div>
                        <div class="col">
                            <input class="form-control" placeholder="Quanti km deve percorere" type="text" id="km-percorere" required />
                        </div>
                        <div class="col">
                            <input class="form-control" placeholder="quanti anni ha?" type="text" id="eta" />
                        </div>
                        <div class="col">
                            <button id="button" class="btn btn-primary ">Conferma</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>   
    </div>        

    <div>
        <p><span id="nome">nome paseggero</span></p>
        <p><span id="offerta">offerta</span></p>
        <p><span id="prezzo">prezzo finale</span></p>
    </div>     
    <script defer src="./script/script.js"></script>       
</body>

</html>
